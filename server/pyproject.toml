[project]
name = "unifai-server"
version = "0.1.0"
description = "API, matching pipeline, and integrations for unif.ai"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "numpy>=2.0",
    "networkx>=3.3",
    "unifai-agent",
]

[project.optional-dependencies]
scrape = ["browser-use>=0.5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
unifai-agent = { path = "../agent", editable = true }
