[project]
name = "unifai-server"
version = "0.1.0"
description = "API, matching pipeline, and integrations for unif.ai"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "numpy>=2.0",
    "ortools>=9.12",
    "typesafe-sdk>=0.7.5",
    "unifai-agent",
]

[project.optional-dependencies]
scrape = ["browser-use>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false

[tool.uv.sources]
unifai-agent = { path = "../agent", editable = true }
