[project]
name = "unifai-agent"
version = "0.1.0"
description = "Persona agents, agent-to-agent conversations, and the compatibility judge for unif.ai"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifai_agent"]
